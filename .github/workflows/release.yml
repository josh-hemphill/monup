name: Release

on:
  push:
    tags:
      - 'v*'
      - '*@*' # Also match package@version tags
  workflow_dispatch:
    inputs:
      dry-run:
        description: Perform dry run only
        type: boolean
        default: true

# Token auth permissions (Phase 1)
# TODO: After first publish, migrate to OIDC trusted publishing:
# 1. Go to npmjs.com → Package Settings → Configure trusted publishing
# 2. Add GitHub Actions as a publishing provider (org/repo)
# 3. Uncomment id-token: write permission below
# 4. Remove NPM_TOKEN from secrets and env
permissions:
  contents: write # For GitHub releases and pushing tags
  id-token: write  # Uncomment for OIDC trusted publishing (Phase 2)

env:
  # Phase 1: Token-based authentication
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  # TODO: Remove NPM_TOKEN after migrating to OIDC trusted publishing

jobs:
  # E2E dry run test to validate everything works
  dry-run:
    name: E2E Dry Run Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for changelog generation

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'

      - name: Build packages
        run: pnpm run build

      - name: Check git working tree after build
        shell: bash
        run: |
          status="$(git status --porcelain=v1)"
          if [[ -z "$status" ]]; then
            exit 0
          fi

          non_bin_changes="$(printf '%s\n' "$status" | while IFS= read -r line; do
            path="${line:3}"
            case "$path" in
              bin/*|*/bin/*) ;;
              *) printf '%s\n' "$line" ;;
            esac
          done)"

          if [[ -z "$non_bin_changes" ]]; then
            echo "Allowing bin-only git working tree changes after build:"
            printf '%s\n' "$status"
            exit 0
          fi

          echo "::error::Build left non-bin files in the git working tree"
          printf '%s\n' "$status"
          exit 1

      - name: Run monup release dry-run
        run: node packages/cli/bin/monup.mjs release --dry-run --log-level debug
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Release job - only runs if dry-run succeeds and not a dry-run-only dispatch
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: dry-run
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build packages
        run: pnpm run build

      - name: Check git working tree after build
        shell: bash
        run: |
          status="$(git status --porcelain=v1)"
          if [[ -z "$status" ]]; then
            exit 0
          fi

          non_bin_changes="$(printf '%s\n' "$status" | while IFS= read -r line; do
            path="${line:3}"
            case "$path" in
              bin/*|*/bin/*) ;;
              *) printf '%s\n' "$line" ;;
            esac
          done)"

          if [[ -z "$non_bin_changes" ]]; then
            echo "Allowing bin-only git working tree changes after build:"
            printf '%s\n' "$status"
            exit 0
          fi

          echo "::error::Build left non-bin files in the git working tree"
          printf '%s\n' "$status"
          exit 1

      - name: Publish packages
        run: node packages/cli/bin/monup.mjs release --log-level debug
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub releases
        run: node packages/cli/bin/monup.mjs github --log-level debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
