name: Release

on:
  push:
    tags:
      - "v*"
      - "*@*" # Also match package@version tags
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Perform dry run only"
        type: boolean
        default: true

# Token auth permissions (Phase 1)
# TODO: After first publish, migrate to OIDC trusted publishing:
# 1. Go to npmjs.com → Package Settings → Configure trusted publishing
# 2. Add GitHub Actions as a publishing provider (org/repo)
# 3. Uncomment id-token: write permission below
# 4. Remove NPM_TOKEN from secrets and env
permissions:
  contents: write # For GitHub releases and pushing tags
  # id-token: write  # Uncomment for OIDC trusted publishing (Phase 2)

env:
  # Phase 1: Token-based authentication
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  # TODO: Remove NPM_TOKEN after migrating to OIDC trusted publishing

jobs:
  # E2E dry run test to validate everything works
  dry-run:
    name: E2E Dry Run Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for changelog generation

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run monup release dry-run
        run: node packages/cli/bin/monup.mjs release --dry-run --log-level debug
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Release job - only runs if dry-run succeeds and not a dry-run-only dispatch
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: dry-run
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

      - name: Publish packages
        run: node packages/cli/bin/monup.mjs release --log-level debug
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub releases
        run: node packages/cli/bin/monup.mjs github --log-level debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
