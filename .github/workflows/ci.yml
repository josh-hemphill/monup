name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          pnpm-version: ''

      - name: Build packages
        run: pnpm run build

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm run lint

      - name: Warn on lint issues
        if: steps.lint.outcome == 'failure'
        run: echo "::warning::Lint reported issues, but CI will continue."

      - name: Run tests
        run: pnpm run test
