name: Setup Node and pnpm
description: Setup Node.js, pnpm, pnpm cache, and install dependencies

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '22'
  pnpm-version:
    description: pnpm version to use
    required: false
    default: latest
  registry-url:
    description: Optional npm registry URL
    required: false
    default: ''
  install:
    description: Run pnpm install after setup
    required: false
    default: 'true'
  frozen-lockfile:
    description: Use --frozen-lockfile when installing
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      if: ${{ inputs.registry-url == '' }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Node.js with registry
      if: ${{ inputs.registry-url != '' }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies (frozen lockfile)
      if: ${{ inputs.install == 'true' && inputs.frozen-lockfile == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install dependencies
      if: ${{ inputs.install == 'true' && inputs.frozen-lockfile != 'true' }}
      shell: bash
      run: pnpm install
